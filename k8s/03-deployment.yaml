apiVersion: apps/v1
kind: Deployment
metadata:
  name: conector-copilot-zabbix
  namespace: conector-copilot-zabbix
  labels:
    app.kubernetes.io/name: conector-copilot-zabbix
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: conector-copilot-zabbix
  template:
    metadata:
      labels:
        app.kubernetes.io/name: conector-copilot-zabbix
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: celdockerrep.celesc.com.br/conector-copilot-zabbix:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: conector-copilot-zabbix-config
            - secretRef:
                name: conector-copilot-zabbix-secrets
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}

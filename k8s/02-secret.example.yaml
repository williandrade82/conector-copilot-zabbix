# EXEMPLO. Não preencha nem faça commit deste arquivo com valores reais.
# Não está no kustomization.yaml de propósito. Crie o Secret a partir do .env:
#
#   kubectl -n conector-copilot-zabbix create secret generic conector-copilot-zabbix-secrets \
#     --from-env-file=.env
#
apiVersion: v1
kind: Secret
metadata:
  name: conector-copilot-zabbix-secrets
  namespace: conector-copilot-zabbix
type: Opaque
stringData:
  ZABBIX_URL: "https://zabbix.exemplo.com/api_jsonrpc.php"
  ZABBIX_API_TOKEN: "<token de um usuário somente leitura>"
  CONNECTOR_API_KEY: "<chave usada pelo Copilot>"
